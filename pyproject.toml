[project]
name = "near-clipping-agent"
version = "0.1.0"
description = "Video Clipping Agent for NEAR Agent Market: long video in, captioned short clips out, each with a reason."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "yt-dlp[default]>=2025.11.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
